{% extends "base.html" %}
{% block title %}sign up{% endblock%}

{% block content %}
    <div class="form-container">
        <h2>SignUp</h2>
        <form method="POST" class="form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required>
            </div>
            <div class="form-group">
                <label for="username">UserName</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter name" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Password (confirm)</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
{% endblock %}
